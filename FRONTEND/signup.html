<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Schedule 360 - Sign Up</title>

</head>

<body>
    
    <!-- Navigation Bar-->
     <header>

        <nav>

            <h2>
                My Schedule 360
            </h2>

            <div>
                <a href="home.html">Home</a>
                <a href="login.html">Login</a>
                <a href="signup.html">Sign Up</a>
            </div>
        </nav>
     </header>

     <!-- Sign Up Form-->>
      <main>
        <section>

            <h1>Create Your Account</h1>

            <p>
                Create an account to start building your personalized schedule.
            </p>

            <form action="#" method="post">
                <!-- First Name-->
                 <div>
                    <label for="First-name">First Name</label>
                    <input 
                    type="text"
                    id="First-name"
                    name="first_name"
                    placeholder="Enter your first name"
                    required
                    >

                 </div>

                   <!-- Last Name-->
                 <div>
                    <label for="last-name">Last Name</label>
                    <input 
                    type="text"
                    id="last-name"
                    name="last_name"
                    placeholder="Enter your last name"
                    required
                    >

                 </div>

                   <!-- Email-->
                 <div>
                    <label for="email">Email</label>
                    <input 
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    >

                 </div>

                   <!-- Password -->
                 <div>
                    <label for="Password">Password</label>
                    <input 
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                    >
                 </div>


                   <!-- Confirm Password -->
                 <div>
                    <label for="confirm-password">Confrim Password</label>
                    <input 
                    type="password"
                    id="confirm-password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                    >
                 </div>


                   <!-- Submit -->

                 <button type="submit">
                    Create Account
                 </button>

            </form>

            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </section>
      </main>
</body>
</html>
